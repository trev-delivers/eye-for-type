name: check
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # obvious is private. With a read-only key in OBVIOUS_TOKEN, git can
      # fetch it for the ds/ check.
      - name: Let git read obvious
        env:
          OBVIOUS_TOKEN: ${{ secrets.OBVIOUS_TOKEN }}
        shell: bash
        run: |
          if [ -n "$OBVIOUS_TOKEN" ]; then
            git config --global url."https://x-access-token:${OBVIOUS_TOKEN}@github.com/trev-delivers/obvious".insteadOf "https://github.com/trev-delivers/obvious"
          else
            echo "OBVIOUS_TOKEN isn't set, so obvious can only be fetched while it's public."
          fi
      # The design system audit lives in obvious.
      - run: git clone --depth 1 https://github.com/trev-delivers/obvious.git ../obvious
      - name: npm run check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
          # A check that skips on a laptop must not skip here.
          if grep -q '^SKIP' check.log; then echo "A check was skipped"; exit 1; fi
