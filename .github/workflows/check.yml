name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The design system audit lives in obvious, which is public.
      - run: git clone --depth 1 https://github.com/trev-delivers/obvious.git ../obvious
      - name: npm run check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
          # A check that skips on a laptop must not skip here.
          if grep -q '^SKIP' check.log; then echo "A check was skipped"; exit 1; fi
